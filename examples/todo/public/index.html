<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo</title>
<style>
  :root { --ink:#16181b; --ground:#f4f5f3; --line:#dcdedb; --muted:#63696e; --accent:#3340d8; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e8eaec; --ground:#121417; --line:#2b2f34; --muted:#969ba1; --accent:#8f9bff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--ground); color:var(--ink); font:15px/1.5 ui-sans-serif, system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 36px 20px; }
  h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -0.02em; }
  p.who { color: var(--muted); margin: 0 0 24px; font-size: 13.5px; }
  form { display: flex; gap: 8px; margin-bottom: 20px; }
  input { flex: 1; padding: 10px 12px; font: inherit; color: var(--ink); background: transparent;
          border: 1px solid var(--line); border-radius: 6px; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { padding: 10px 15px; font: 500 14px/1 inherit; color:#fff; background: var(--accent);
           border: 0; border-radius: 6px; cursor: pointer; }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  li { display: flex; align-items: center; gap: 12px; padding: 11px 2px; border-bottom: 1px solid var(--line); }
  li.done .text { text-decoration: line-through; color: var(--muted); }
  .text { flex: 1; cursor: pointer; }
  .by { font-size: 12px; color: var(--muted); }
  .x { background: none; color: var(--muted); font-size: 18px; padding: 0 4px; }
  .empty { padding: 28px 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Todo</h1>
  <p class="who" id="who"></p>
  <form id="add"><input id="text" placeholder="Add something" autocomplete="off" required><button>Add</button></form>
  <ul id="list"></ul>
</main>
<script type="module">
const list = document.getElementById('list');
const who = document.getElementById('who');

async function api(path = '', opts) {
  const res = await fetch('api/todos' + path, opts);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

function render(data) {
  who.textContent = 'Signed in as ' + data.you;
  list.innerHTML = '';
  if (!data.todos.length) {
    list.innerHTML = '<li class="empty">Nothing yet.</li>';
    return;
  }
  for (const t of data.todos) {
    const li = document.createElement('li');
    if (t.done) li.className = 'done';
    const text = document.createElement('span');
    text.className = 'text';
    text.textContent = t.text;
    text.onclick = () => api('/' + t.id, { method: 'POST' }).then(render);
    const by = document.createElement('span');
    by.className = 'by';
    by.textContent = t.who;
    const x = document.createElement('button');
    x.className = 'x';
    x.textContent = '×';
    x.title = 'Delete';
    x.onclick = () => api('/' + t.id, { method: 'DELETE' }).then(render);
    li.append(text, by, x);
    list.append(li);
  }
}

document.getElementById('add').onsubmit = async (e) => {
  e.preventDefault();
  const input = document.getElementById('text');
  render(await api('', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text: input.value }) }));
  input.value = '';
};

render(await api());
</script>
</body>
</html>
