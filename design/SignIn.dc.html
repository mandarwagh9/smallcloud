<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
:root{
  --paper:#f0ece1; --paper-2:#e7e0cf; --card:#f7f4ec;
  --ink:#1c1a16; --ink-2:#5c574c; --faint:#8a8474;
  --line:#d8d0bd; --line-2:#c7bda6;
  --brand:#d94f27; --brand-ink:#b23c18; --brand-soft:#f3ddd0;
  --live:#1f6f4f; --live-ink:#175a40; --live-soft:#dce8de;
  --danger:#8f2d2d;
  --serif:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Space Grotesk","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"Space Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;}
a{color:var(--brand-ink);text-decoration:none;}
a:hover{text-decoration:underline;text-underline-offset:3px;}
.wrap{max-width:720px;margin:0 auto;padding:0 44px;}
.wrap.narrow{max-width:496px;}
.topbar{display:flex;align-items:center;gap:14px;padding:22px 0 18px;}
.brand{display:inline-flex;align-items:center;gap:9px;font:500 15px/1 var(--mono);letter-spacing:-.01em;color:var(--ink);}
.brand:hover{text-decoration:none;}
.brand .mk{width:17px;height:17px;color:var(--brand);}
.topbar nav{margin-left:auto;display:flex;align-items:center;gap:20px;font:400 13.5px/1 var(--sans);}
.rule{height:1px;background:var(--line);border:0;margin:0;}
.kicker{display:inline-flex;align-items:center;gap:8px;font:500 12px/1 var(--mono);letter-spacing:.17em;text-transform:uppercase;color:var(--faint);}
.kicker .tick{width:16px;height:2px;background:var(--brand);display:inline-block;}
h1.mast{font:400 50px/1.0 var(--serif);letter-spacing:-.01em;margin:16px 0 0;}
.lede{font:400 19px/1.5 var(--sans);color:var(--ink-2);margin:14px 0 0;}
label{display:block;font:500 13px/1 var(--sans);margin:0 0 8px;color:var(--ink-2);}
input[type=email]{width:100%;padding:12px 14px;font:400 15px/1.3 var(--sans);color:var(--ink);background:var(--card);border:1.5px solid var(--line-2);border-radius:3px;}
input::placeholder{color:var(--faint);}
input:focus{outline:none;border-color:var(--brand);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;font:500 14.5px/1 var(--sans);border-radius:3px;border:1.5px solid transparent;cursor:pointer;white-space:nowrap;width:100%;}
.btn svg{width:15px;height:15px;}
.btn-primary{background:var(--brand);color:#fbf3ec;}
.btn-primary:hover{background:var(--brand-ink);text-decoration:none;}
.note{font:400 13.5px/1.5 var(--sans);color:var(--faint);margin:18px 0 0;}
.mono{font-family:var(--mono);font-size:.92em;}
</style>
</helmet>

<div style="min-height:600px;">
  <div class="wrap">
    <div class="topbar">
      <a class="brand" href="#"><svg class="mk" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="2.5" width="15" height="15" rx="2"></rect><rect x="6" y="6" width="8" height="8" rx="1" fill="currentColor" stroke="none"></rect></svg>smallcloud</a>
      <nav><a href="#">the app contract</a></nav>
    </div>
    <hr class="rule">
  </div>

  <div class="wrap narrow" style="padding-top:78px;">
    <div class="kicker"><span class="tick"></span>Sign in</div>
    <h1 class="mast">Sign in.</h1>
    <p class="lede">Enter your email and we&#8217;ll send you a link. No password.</p>

    <div style="margin-top:34px;">
      <label for="e">Email address</label>
      <input id="e" type="email" placeholder="you@example.com" value="bob@example.com">
      <div style="margin-top:14px;">
        <a class="btn btn-primary" href="#">Email me a link
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10h11M11 6l4 4-4 4"></path></svg></a>
      </div>
      <p class="note">The link works once and expires in 15 minutes. New here? Signing in creates your account &#8212; nothing else to set up.</p>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
